spring.application.name=orderservice
spring.profiles.active=dev
spring.config.import=configserver:http://localhost:8887

# Product Service
product.service.url=http://localhost:8085

# Circuit Breaker
resilience4j.circuitbreaker.instances.productService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.productService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.productService.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.productService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.productService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.productService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Retry
resilience4j.retry.instances.productService.maxAttempts=2
resilience4j.retry.instances.productService.waitDuration=500ms
resilience4j.retry.instances.productService.enableExponentialBackoff=true
resilience4j.retry.instances.productService.exponentialBackoffMultiplier=2

saga.payment.simulate-failure=false

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

management.otlp.metrics.export.enabled=false

saga.recovery.fixed-delay-ms=10000
