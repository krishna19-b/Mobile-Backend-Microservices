
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/mobile_product_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [service=productservice] [correlationId=%X{correlationId}] %-5level %logger{36} - %msg%n
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
