
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/mobile_product_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [service=orderservice] [traceId=%X{traceId}] [spanId=%X{spanId}] [correlationId=%X{correlationId}] %-5level %logger{36} - %msg%n
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.tracing.export.zipkin.enabled=true
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
